x-java-tls-environment: &java-tls-environment
  SERVER_SSL_ENABLED: 'true'
  SERVER_SSL_KEY_STORE: file:/certs/service/keystore.p12
  SERVER_SSL_KEY_STORE_TYPE: PKCS12
  SERVER_SSL_KEY_STORE_PASSWORD: ${TLS_STORE_PASSWORD:?Run python3 scripts/prepare-tls.py first}
  SERVER_FORWARD_HEADERS_STRATEGY: framework
  JDK_JAVA_OPTIONS: '@/certs/ca/java-tls.options'

services:
  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    environment:
      <<: *java-tls-environment
      CONFIG_SERVER_URL: https://config-server:8888
      EUREKA_URL: https://eureka-server:8761/eureka/
      STARSHIP_URL: https://haproxy:8082
      UPSTREAM_TLS: 'true'
      EUREKA_INSTANCE_HOSTNAME: api-gateway
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: 'false'
      EUREKA_INSTANCE_NON_SECURE_PORT_ENABLED: 'false'
      EUREKA_INSTANCE_SECURE_PORT_ENABLED: 'true'
      EUREKA_INSTANCE_SECURE_PORT: '8080'
      EUREKA_INSTANCE_HOME_PAGE_URL: https://api-gateway:8080/
      EUREKA_INSTANCE_STATUS_PAGE_URL: https://api-gateway:8080/actuator/info
      EUREKA_INSTANCE_HEALTH_CHECK_URL: https://api-gateway:8080/actuator/health
    volumes:
      - ./certs/api-gateway:/certs/service:ro
      - ./certs/ca:/certs/ca:ro
    ports:
      - "8080:8080"
    depends_on:
      config-server:
        condition: service_started
      eureka-server:
        condition: service_started
    restart: on-failure

  eureka-server:
    build:
      context: .
      dockerfile: eureka-server/Dockerfile
    environment:
      <<: *java-tls-environment
      CONFIG_SERVER_URL: https://config-server:8888
      EUREKA_URL: https://eureka-server:8761/eureka/
      EUREKA_INSTANCE_HOSTNAME: eureka-server
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: 'false'
    volumes:
      - ./certs/eureka-server:/certs/service:ro
      - ./certs/ca:/certs/ca:ro
    ports:
      - "127.0.0.1:8761:8761"
    depends_on:
      config-server:
        condition: service_started
    restart: on-failure

  config-server:
    build:
      context: .
      dockerfile: config-server/Dockerfile
    environment:
      <<: *java-tls-environment
    volumes:
      - ./certs/config-server:/certs/service:ro
      - ./certs/ca:/certs/ca:ro
    ports:
      - "127.0.0.1:8888:8888"
    restart: on-failure

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: space_marine
      POSTGRES_USER: root
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD before starting Compose}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d space_marine"]
      interval: 5s
      timeout: 5s
      retries: 10

  collection-service:
    build:
      context: .
      dockerfile: collection-service/Dockerfile
    environment:
      <<: *java-tls-environment
      EUREKA_URL: https://eureka-server:8761/eureka/
      CONFIG_SERVER_URL: https://config-server:8888
      SPRING_CONFIG_IMPORT: configserver:https://config-server:8888
      SPRING_CLOUD_CONFIG_FAIL_FAST: 'true'
      SPRING_CLOUD_CONFIG_RETRY_MAX_ATTEMPTS: 20
      DB_URL: jdbc:postgresql://db:5432/space_marine
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD before starting Compose}
      EUREKA_INSTANCE_HOSTNAME: collection-service
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: 'false'
      EUREKA_INSTANCE_NON_SECURE_PORT_ENABLED: 'false'
      EUREKA_INSTANCE_SECURE_PORT_ENABLED: 'true'
      EUREKA_INSTANCE_SECURE_PORT: '8081'
      EUREKA_INSTANCE_HOME_PAGE_URL: https://collection-service:8081/
      EUREKA_INSTANCE_STATUS_PAGE_URL: https://collection-service:8081/actuator/info
      EUREKA_INSTANCE_HEALTH_CHECK_URL: https://collection-service:8081/actuator/health
    volumes:
      - ./certs/collection-service:/certs/service:ro
      - ./certs/ca:/certs/ca:ro
    expose:
      - "8081"
    depends_on:
      eureka-server:
        condition: service_started
      config-server:
        condition: service_started
      db:
        condition: service_healthy
    restart: on-failure

  starship-service:
    build:
      context: .
      dockerfile: starship-service/Dockerfile
    environment:
      <<: *java-tls-environment
      COLLECTION_URL: https://collection-service:8081/api/v1
      DB_URL: jdbc:postgresql://db:5432/space_marine
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD before starting Compose}
    volumes:
      - ./certs/starship-service:/certs/service:ro
      - ./certs/ca:/certs/ca:ro
    expose:
      - "8082"
    deploy:
      replicas: 2
    depends_on:
      db:
        condition: service_healthy
      collection-service:
        condition: service_started
    restart: on-failure

  haproxy:
    image: haproxy:3.2-alpine
    volumes:
      - ./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
      - ./certs/haproxy:/certs/service:ro
      - ./certs/ca:/certs/ca:ro
    expose:
      - "8082"
    depends_on:
      starship-service:
        condition: service_started
    restart: on-failure

  soa-front:
    build:
      context: ./soa-front
      dockerfile: Dockerfile
    environment:
      NODE_EXTRA_CA_CERTS: /certs/ca/root-ca.crt
      SPACE_MARINES_API_URL: https://api-gateway:8080/collection-service
      STARSHIPS_API_URL: https://api-gateway:8080/starship-service
    volumes:
      - ./certs/soa-front:/certs/service:ro
      - ./certs/ca/root-ca.crt:/certs/ca/root-ca.crt:ro
    expose:
      - "3000"
    depends_on:
      api-gateway:
        condition: service_started
    restart: on-failure

  caddy:
    image: caddy:2-alpine
    environment:
      CADDY_HTTPS_PORT: ${CADDY_HTTPS_PORT:-443}
    ports:
      - "${CADDY_PORT:-80}:80"
      - "${CADDY_HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs/caddy:/certs/service:ro
      - ./certs/ca:/certs/ca:ro
    depends_on:
      - api-gateway
      - soa-front

volumes:
  postgres_data:
