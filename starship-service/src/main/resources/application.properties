spring.application.name=starship-service
springdoc.swagger-ui.url=/openapi.yaml
springdoc.swagger-ui.disable-swagger-default-url=true
server.port=${PORT:8082}
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/space_marine}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD}
spring.flyway.schemas=starship
spring.flyway.default-schema=starship
spring.datasource.hikari.connection-init-sql=SET search_path TO starship
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=starship
spring.jpa.open-in-view=false
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.default-property-inclusion=always
openapi.spaceMarineCollection.base-path=/api/v1
collection.base-url=${COLLECTION_URL:http://localhost:8081/api/v1}
server.tomcat.accesslog.enabled=true
server.tomcat.accesslog.directory=${HTTP_ACCESS_LOG_DIRECTORY:/dev}
server.tomcat.accesslog.prefix=${HTTP_ACCESS_LOG_PREFIX:stdout}
server.tomcat.accesslog.suffix=
server.tomcat.accesslog.file-date-format=
server.tomcat.accesslog.rotate=false
server.tomcat.accesslog.buffered=false
server.tomcat.accesslog.pattern=[http] service=${spring.application.name} time=%t method=%m path=%U status=%s duration_ms=%{ms}T bytes=%B
