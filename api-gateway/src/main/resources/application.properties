server.port=${PORT:8080}
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true
# Explicit allowlist: never expose Config Server, Eureka or the gateway itself as routes.
zuul.ignored-services=*
zuul.routes.collection-api.path=/api/collection-service/**
zuul.routes.collection-api.service-id=collection-service
zuul.routes.starship-api.path=/api/starship-service/**
zuul.routes.starship-api.service-id=starship-service
zuul.routes.starship-api.url=${STARSHIP_URL:}
# Full upstream paths for OpenAPI / Swagger UI and other service resources.
zuul.routes.collection-resources.path=/collection-service/**
zuul.routes.collection-resources.service-id=collection-service
zuul.routes.starship-resources.path=/starship-service/**
zuul.routes.starship-resources.service-id=starship-service
zuul.routes.starship-resources.url=${STARSHIP_URL:}
zuul.retryable=false
zuul.sensitive-headers=
zuul.host.connect-timeout-millis=3000
zuul.host.socket-timeout-millis=15000
ribbon.ConnectTimeout=3000
ribbon.ReadTimeout=15000
ribbon.MaxAutoRetries=0
ribbon.MaxAutoRetriesNextServer=0
ribbon.OkToRetryOnAllOperations=false
collection-service.ribbon.NFLoadBalancerRuleClassName=com.netflix.loadbalancer.RoundRobinRule
collection-service.ribbon.IsSecure=${UPSTREAM_TLS:false}
starship-service.ribbon.NFLoadBalancerRuleClassName=com.netflix.loadbalancer.RoundRobinRule
# Nested Starship -> gateway -> Collection calls must not share a Hystrix thread pool.
zuul.ribbon-isolation-strategy=SEMAPHORE
hystrix.command.default.execution.timeout.enabled=false
