spring.application.name=collection-service
spring.config.import=configserver:${CONFIG_SERVER_URL:http://localhost:8888}
server.tomcat.accesslog.enabled=true
server.tomcat.accesslog.directory=${HTTP_ACCESS_LOG_DIRECTORY:/dev}
server.tomcat.accesslog.prefix=${HTTP_ACCESS_LOG_PREFIX:stdout}
server.tomcat.accesslog.suffix=
server.tomcat.accesslog.file-date-format=
server.tomcat.accesslog.rotate=false
server.tomcat.accesslog.buffered=false
server.tomcat.accesslog.pattern=[http] service=${spring.application.name} time=%t method=%m path=%U status=%s duration_ms=%{ms}T bytes=%B
