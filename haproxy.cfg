global
    log stdout format raw local0

defaults
    log global
    mode http
    option httplog
    timeout connect 3s
    timeout client 30s
    timeout server 30s
    retries 0

# Docker DNS returns the addresses of all replicas and updates them on restart.
resolvers docker
    nameserver dns 127.0.0.11:53
    accepted_payload_size 8192
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold valid 5s
    hold obsolete 5s

frontend starship
    bind :8082
    default_backend starship_instances

backend starship_instances
    balance roundrobin
    option httpchk
    http-check send meth GET uri /api/v1/starships
    http-check expect status 200
    default-server inter 3s fall 3 rise 2
    server-template starship 1-10 starship-service:8082 check resolvers docker resolve-prefer ipv4 init-addr none
